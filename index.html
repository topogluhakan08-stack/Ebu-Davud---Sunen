    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sunen_adab_settings_v1');
          if (!raw) return;
          var s = JSON.parse(raw);
          var r = document.documentElement;
          if (s.theme === 'dark') r.classList.add('dark');
          if (s.highContrast) r.classList.add('high-contrast');
          if (s.reducedMotion) r.classList.add('reduce-motion');
        } catch (e) {}
      })();
    </script>
